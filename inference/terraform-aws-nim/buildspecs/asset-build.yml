# # ---------------------------------------------------------------------------
# # Asset Build — GPU CodeBuild project (var.enable_asset_build = true)
# #
# # Runs asset-build.sh inside the NIM shim container to build TRT engines from
# # HuggingFace weights (HF → ONNX → TRT) and upload them to the S3 asset cache.
# #
# # This project uses a CodeBuild reserved capacity fleet with the exact same GPU
# # instance type as sagemaker_config.instance_type. TRT engines are NOT portable
# # across SM versions — the fleet MUST match:
# #   g5  (A10G/SM86), g6/g6e (L4/L40S/SM89), p4d/p5 (A100/H100/SM80/SM90)
# #
# # This build is idempotent: if S3 already contains a warm cache at
# # s3://$S3_BUCKET/$ASSET_CACHE_PREFIX/, the build exits immediately.
# #
# # Environment variables (set by codebuild.tf):
# #   ECR_REPO_URI       — ECR repo URI
# #   BASE_SYNC_PROJECT  — name of the base-sync project to poll
# #   SHIM_TAG           — shim image tag (default: "shim")
# #   S3_BUCKET          — S3 bucket for asset cache
# #   ASSET_CACHE_PREFIX — S3 key prefix (e.g. "nim-cache/g6e.12xlarge")
# #   CACHE_PATH         — container path where NIM reads cached artifacts
# #   HF_TOKEN           — HuggingFace token (REQUIRED for weight download)
# #   NGC_API_KEY        — NGC API key
# #   AWS_DEFAULT_REGION — region
# # ---------------------------------------------------------------------------

