# terraform-docs configuration
#
# Injects the generated docs into README.md between the markers:
#   <!-- BEGIN_TF_DOCS -->
#   <!-- END_TF_DOCS -->
#
# Run manually from the module root:
#   terraform-docs .
#
# Or via pre-commit (runs automatically on changed .tf files):
#   pre-commit run terraform_docs --all-files

formatter: markdown table

sort:
  enabled: true
  by: required

output:
  file: README.md
  mode: inject

template: |-
  <!-- markdownlint-disable -->
  <!-- BEGIN_TF_DOCS -->
  {{ .Content }}
  <!-- END_TF_DOCS -->
  <!-- markdownlint-enable -->
